apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lab01
spec:
  project: default
  source:
    repoURL: https://github.com/dizal8/devops-lab.git
    targetRevision: main
    path: infrastructure/argocd/crds
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
