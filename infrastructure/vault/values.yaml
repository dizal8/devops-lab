global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  enabled: true

  image:
    repository: hashicorp/vault
    tag: "2.0.3"
    pullPolicy: IfNotPresent

  dev:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1

    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/data
    storageClass: "local-path"
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  readinessProbe:
    enabled: true
    failureThreshold: 2
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3

  livenessProbe:
    enabled: true
    execCommand:
      - /bin/sh
      - -ec
      - |
        vault status >/dev/null 2>&1
        rc=$?
        [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]
    initialDelaySeconds: 30
    failureThreshold: 6
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

ui:
  enabled: true
  serviceType: ClusterIP
