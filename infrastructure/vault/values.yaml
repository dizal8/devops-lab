global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  enabled: true

  image:
    repository: hashicorp/vault
    tag: "2.0.3"
    pullPolicy: IfNotPresent

  dev:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1

    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/data
    storageClass: "local-path"
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  readinessProbe:
    enabled: true

  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 60

ui:
  enabled: true
  serviceType: ClusterIP
