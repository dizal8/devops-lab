<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#0d1117">
<title>DZL Ops Console</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel2: #1c2430;
  --border: #30363d;
  --text: #f0f6fc;
  --muted: #8b949e;
  --green: #3fb950;
  --blue: #58a6ff;
  --radius: 12px;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  padding:
    max(8px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
}

.app {
  width: min(1500px, 100%);
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 10px 12px;
  margin-bottom: 8px;

  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.brand {
  min-width: 0;
}

.brand-title {
  font-weight: 700;
  letter-spacing: .04em;
}

.brand-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 999px;
  box-shadow: 0 0 10px var(--green);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

button {
  min-height: 38px;
  padding: 8px 12px;

  border: 1px solid var(--border);
  border-radius: 9px;

  background: var(--panel2);
  color: var(--text);

  cursor: pointer;
  font-size: 13px;
}

button:hover {
  border-color: var(--blue);
}

.terminal {
  width: min(1200px, 100%);
  height: 720px;
  margin: auto;

  border: 1px solid var(--border);
  border-radius: var(--radius);

  overflow: hidden;
  background: #000;
}

.terminal.expanded {
  width: 100%;
  height: calc(100dvh - 120px);
}

iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.mobile-toolbar {
  display: none;
  gap: 4px;
  margin-top: 7px;
}

.mobile-toolbar button {
  min-width: 0;
  padding: 7px 4px;
  font-family: monospace;
}

.toast {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);

  max-width: 90vw;
  padding: 9px 12px;

  border: 1px solid var(--border);
  border-radius: 8px;

  background: var(--panel2);
  color: var(--text);

  z-index: 9999;
  font-size: 12px;
}

@media (max-width: 720px) {
  .brand-sub {
    display: none;
  }

  .toolbar button {
    flex: 1 1 auto;
  }

  .terminal,
  .terminal.expanded {
    width: 94vw;
    height: 78dvh;
  }

  .mobile-toolbar {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
  }
}

:fullscreen .terminal {
  width: 100vw;
  height: 100vh;
  max-width: none;
  border: 0;
  border-radius: 0;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="brand">
      <div class="brand-title">
        DZL OPS CONSOLE
      </div>

      <div class="brand-sub">
        DevOps Lab · Private Tailnet Console
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Online
    </div>

  </div>

  <div class="toolbar">

    <button onclick="copyCommand('clear')">
      Clear
    </button>

    <button onclick="copyCommand('git status')">
      Git
    </button>

    <button
      onclick="copyCommand(
        'kubectl get applications -n argocd'
      )"
    >
      Argo
    </button>

    <button
      onclick="copyCommand(
        'kubectl get pods -A'
      )"
    >
      Pods
    </button>

    <button
      onclick="copyCommand(
        'kubectl get externalsecret -A'
      )"
    >
      ESO
    </button>

    <button
      onclick="copyCommand(
        'kubectl get pod vault-0 -n vault'
      )"
    >
      Vault
    </button>

    <button
      onclick="copyCommand(
        'bash scripts/ai-readonly-audit.sh'
      )"
    >
      AI Audit
    </button>

    <button onclick="toggleExpand()">
      Expand
    </button>

    <button onclick="fullscreenTerminal()">
      Fullscreen
    </button>

  </div>

  <div id="terminal" class="terminal">

    <iframe
      id="terminalFrame"
      src="/terminal/"
      allow="clipboard-read; clipboard-write"
    ></iframe>

  </div>

  <div class="mobile-toolbar">
    <button onclick="copyKey('ESC')">ESC</button>
    <button onclick="copyKey('TAB')">TAB</button>
    <button onclick="copyKey('CTRL+C')">^C</button>
    <button onclick="copyKey('CTRL+L')">^L</button>
    <button onclick="copyKey('UP')">↑</button>
    <button onclick="copyKey('DOWN')">↓</button>
    <button onclick="copyKey('LEFT')">←</button>
    <button onclick="copyKey('RIGHT')">→</button>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
const terminal = document.getElementById("terminal");
const frame = document.getElementById("terminalFrame");
const toast = document.getElementById("toast");

function showToast(message) {
  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1600);
}

async function copyCommand(command) {
  try {
    await navigator.clipboard.writeText(command);
    frame.focus();
    showToast("Copied: " + command);
  } catch {
    showToast(command);
  }
}

async function copyKey(key) {
  try {
    await navigator.clipboard.writeText(key);
    frame.focus();
    showToast(key + " copied");
  } catch {
    showToast(key);
  }
}

function toggleExpand() {
  terminal.classList.toggle("expanded");
}

async function fullscreenTerminal() {
  if (!document.fullscreenElement) {
    await terminal.requestFullscreen();
  } else {
    await document.exitFullscreen();
  }
}
</script>

</body>
</html>
