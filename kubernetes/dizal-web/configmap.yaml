apiVersion: v1
kind: ConfigMap
metadata:
  name: dizal-web-content
  labels:
    app: dizal-web
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>DZL DevOps Platform</title>
      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: Inter, Arial, sans-serif;
          background:
            radial-gradient(circle at top right, rgba(37, 99, 235, 0.18), transparent 35%),
            #07101f;
          color: #e5eefc;
          min-height: 100vh;
        }

        a {
          color: inherit;
          text-decoration: none;
        }

        header {
          padding: 46px 6%;
          border-bottom: 1px solid #23324a;
          background: rgba(11, 22, 40, 0.86);
        }

        .header-content {
          max-width: 1250px;
          margin: auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 30px;
          flex-wrap: wrap;
        }

        h1 {
          margin: 0 0 10px;
          font-size: 42px;
          letter-spacing: -1px;
        }

        .subtitle {
          margin: 0;
          color: #9fb2d0;
          font-size: 17px;
        }

        .cluster-badge {
          padding: 12px 18px;
          border: 1px solid #1e8f62;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.12);
          color: #6ee7b7;
          font-weight: 700;
        }

        main {
          max-width: 1250px;
          margin: auto;
          padding: 38px 24px 60px;
        }

        .section-title {
          margin: 0 0 18px;
          font-size: 22px;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
          gap: 18px;
          margin-bottom: 38px;
        }

        .card {
          min-height: 180px;
          padding: 24px;
          border: 1px solid #23324a;
          border-radius: 16px;
          background: linear-gradient(145deg, #111d31, #0c1728);
          transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
          transform: translateY(-4px);
          border-color: #3b82f6;
        }

        .card h2 {
          margin: 0 0 10px;
          font-size: 19px;
        }

        .card p {
          min-height: 42px;
          margin: 0 0 18px;
          color: #aebdd3;
          line-height: 1.45;
        }

        .status {
          display: inline-block;
          padding: 6px 11px;
          border-radius: 999px;
          background: #075b43;
          color: #78f0c0;
          font-size: 12px;
          font-weight: 800;
          letter-spacing: 0.4px;
        }

        .link {
          display: block;
        }

        .architecture {
          padding: 26px;
          border: 1px solid #23324a;
          border-radius: 16px;
          background: #0c1728;
        }

        .flow {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-wrap: wrap;
          gap: 12px;
          margin-top: 20px;
        }

        .flow-item {
          padding: 12px 18px;
          border-radius: 10px;
          background: #15243a;
          border: 1px solid #2c405f;
          font-weight: 700;
        }

        .arrow {
          color: #60a5fa;
          font-size: 22px;
        }

        footer {
          padding: 28px;
          text-align: center;
          color: #7386a5;
          border-top: 1px solid #1c2b42;
        }

        @media (max-width: 600px) {
          h1 {
            font-size: 32px;
          }

          .arrow {
            transform: rotate(90deg);
          }
        }

        /* DZL portal enhancements */
        .quick-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 9px;
          align-items: center;
          justify-content: flex-end;
        }

        .quick-action {
          padding: 9px 13px;
          border: 1px solid #304767;
          border-radius: 10px;
          background: #13223a;
          color: #dbeafe;
          font-size: 13px;
          font-weight: 700;
          transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .quick-action:hover {
          transform: translateY(-2px);
          border-color: #60a5fa;
        }

        .platform-summary {
          border-bottom: 1px solid #1f3049;
          background: rgba(11, 23, 41, 0.92);
        }

        .summary-inner {
          max-width: 1250px;
          margin: auto;
          padding: 14px 24px;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 9px;
        }

        .technology-pill {
          padding: 7px 11px;
          border: 1px solid #263b59;
          border-radius: 999px;
          color: #a9bddb;
          background: #0f1c30;
          font-size: 12px;
          font-weight: 700;
        }

        .health-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
          gap: 14px;
          margin-bottom: 38px;
        }

        .health-card {
          padding: 19px;
          border: 1px solid #233750;
          border-radius: 14px;
          background: linear-gradient(145deg, #101e33, #0b1728);
        }

        .health-label {
          color: #8fa4c4;
          font-size: 12px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.7px;
        }

        .health-value {
          margin-top: 9px;
          font-size: 27px;
          font-weight: 800;
          color: #f1f5f9;
        }

        .health-detail {
          margin-top: 5px;
          color: #6ee7b7;
          font-size: 12px;
          font-weight: 700;
        }

        .commit-panel {
          margin-bottom: 38px;
          padding: 19px 22px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 20px;
          flex-wrap: wrap;
          border: 1px solid #233750;
          border-radius: 14px;
          background: #0c182b;
        }

        .commit-title {
          font-size: 12px;
          color: #8fa4c4;
          text-transform: uppercase;
          font-weight: 700;
          letter-spacing: 0.7px;
        }

        .commit-message {
          margin-top: 7px;
          font-size: 15px;
          font-weight: 700;
        }

        .commit-meta {
          color: #8fa4c4;
          font-size: 12px;
        }

        .footer-links {
          margin-top: 12px;
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 15px;
        }

        .footer-links a {
          color: #60a5fa;
          font-weight: 700;
        }

        @media (max-width: 760px) {
          .quick-actions {
            justify-content: flex-start;
          }
        }

      /* DZL_TERMINAL_INTEGRATION_V1 */

      .dzl-terminal-action {
        appearance: none;
        font: inherit;
        cursor: pointer;
      }

      .dzl-terminal-overlay {
        position: fixed;
        inset: 0;
        z-index: 99990;

        display: none;
        align-items: center;
        justify-content: center;

        padding: 3vh 3vw;

        background:
          radial-gradient(
            circle at top,
            rgba(30, 64, 175, .14),
            transparent 40%
          ),
          rgba(2, 8, 23, .88);

        backdrop-filter: blur(8px);
      }

      .dzl-terminal-overlay.open {
        display: flex;
      }

      .dzl-terminal-window {
        width: min(2000px, 96vw);
        height: 94vh;

        display: flex;
        flex-direction: column;

        overflow: hidden;

        border:
          1px solid rgba(96, 165, 250, .28);

        border-radius: 16px;

        background: #080d14;

        box-shadow:
          0 30px 90px rgba(0, 0, 0, .60),
          0 0 45px rgba(59, 130, 246, .08);
      }

      .dzl-terminal-window.expanded {
        width: 99vw;
        height: 98vh;
      }

      .dzl-terminal-header {
        min-height: 54px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 12px;

        padding: 9px 12px;

        border-bottom:
          1px solid rgba(148, 163, 184, .16);

        background: #0d1726;
      }

      .dzl-terminal-title {
        display: flex;
        align-items: center;
        gap: 10px;

        min-width: 0;

        color: #e5efff;
        font-weight: 700;
      }

      .dzl-terminal-title-icon {
        color: #67e8f9;
        font-family: monospace;
        font-weight: 900;
      }

      .dzl-private-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;

        padding: 4px 8px;

        border:
          1px solid rgba(52, 211, 153, .28);

        border-radius: 999px;

        background:
          rgba(16, 185, 129, .10);

        color: #6ee7b7;

        font-size: 10px;
        font-weight: 800;

        white-space: nowrap;
      }

      .dzl-terminal-controls,
      .dzl-terminal-shortcuts {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .dzl-terminal-control,
      .dzl-terminal-shortcut {
        appearance: none;

        border:
          1px solid rgba(148, 163, 184, .20);

        border-radius: 8px;

        background: #142033;
        color: #dbeafe;

        padding: 7px 10px;

        font: inherit;
        font-size: 11px;
        font-weight: 700;

        cursor: pointer;
      }

      .dzl-terminal-control:hover,
      .dzl-terminal-shortcut:hover {
        border-color: #60a5fa;
        background: #172b46;
      }

      .dzl-terminal-control.danger:hover {
        border-color: #fb7185;
      }

      .dzl-terminal-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 8px;

        padding: 7px 10px;

        border-bottom:
          1px solid rgba(148, 163, 184, .12);

        background: #0a121e;
      }

      .dzl-terminal-hint {
        color: #64748b;
        font-size: 10px;
        white-space: nowrap;
      }

      .dzl-terminal-frame-wrap {
        flex: 1;
        min-height: 0;

        background: #000;
      }

      #dzl-terminal-frame {
        width: 100%;
        height: 100%;

        display: block;

        border: 0;

        background: #000;
      }

      .dzl-terminal-toast {
        position: fixed;

        left: 50%;
        bottom: 24px;

        z-index: 100000;

        transform:
          translate(-50%, 20px);

        opacity: 0;
        pointer-events: none;

        padding: 9px 13px;

        border:
          1px solid rgba(96, 165, 250, .28);

        border-radius: 9px;

        background: #0f1b2d;
        color: #dbeafe;

        font-size: 12px;

        transition:
          opacity .18s ease,
          transform .18s ease;
      }

      .dzl-terminal-toast.visible {
        opacity: 1;

        transform:
          translate(-50%, 0);
      }

      body.dzl-terminal-open {
        overflow: hidden;
      }

      @media (max-width: 720px) {

        .dzl-terminal-overlay {
          padding:
            max(6px, env(safe-area-inset-top))
            max(5px, env(safe-area-inset-right))
            max(6px, env(safe-area-inset-bottom))
            max(5px, env(safe-area-inset-left));
        }

        .dzl-terminal-window,
        .dzl-terminal-window.expanded {
          width: 97vw;
          height: 94dvh;

          border-radius: 11px;
        }

        .dzl-terminal-header {
          min-height: 48px;

          padding:
            6px 8px;
        }

        .dzl-private-pill {
          display: none;
        }

        .dzl-terminal-controls {
          gap: 3px;
        }

        .dzl-terminal-control {
          padding: 6px 8px;
          font-size: 10px;
        }

        .dzl-terminal-toolbar {
          overflow-x: auto;

          justify-content:
            flex-start;
        }

        .dzl-terminal-shortcuts {
          flex-wrap: nowrap;
        }

        .dzl-terminal-shortcut {
          white-space: nowrap;

          padding: 6px 8px;
        }

        .dzl-terminal-hint {
          display: none;
        }
      }

      :fullscreen .dzl-terminal-window {
        width: 100vw;
        height: 100vh;

        max-width: none;
        max-height: none;

        border: 0;
        border-radius: 0;
      }

    /* DZL_SESSION_TOOLS_FINAL_CSS */

    .dzl-terminal-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dzl-terminal-session-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .dzl-terminal-toolbar > .dzl-terminal-shortcuts {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      justify-content: flex-end;
    }

    .dzl-paste-button {
      border-color: rgba(52, 211, 153, .48);
    }

    @media (max-width: 720px) {
      .dzl-terminal-toolbar {
        overflow-x: auto;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .dzl-terminal-session-actions,
      .dzl-terminal-toolbar > .dzl-terminal-shortcuts {
        flex: 0 0 auto;
        flex-wrap: nowrap;
      }

      .dzl-terminal-shortcut {
        min-height: 38px;
        padding: 8px 10px;
        white-space: nowrap;
      }
    }


    /* DZL_RUN_BUTTON_FINAL_CSS */

    .dzl-run-button {
      border-color:
        rgba(96, 165, 250, .60);

      background:
        rgba(30, 64, 110, .58);
    }

    .dzl-run-button:hover {
      background:
        rgba(37, 79, 135, .78);
    }

    @media (max-width: 720px) {
      .dzl-run-button {
        min-width: 54px;
        min-height: 38px;
      }
    }



      /* DZL_CONSOLE_V8 */

      .dzl-terminal-split {
        --dzl-terminal-pane: 55%;
        display: grid;
        grid-template-columns:
          minmax(0, var(--dzl-terminal-pane))
          8px
          minmax(320px, 1fr);
        flex: 1;
        min-height: 0;
        gap: 6px;
        padding: 0 8px 8px;
      }

      .dzl-ai-workspace {
        border: 1px solid #263a58;
        border-radius: 8px;
        background: #091424;
        padding: 12px;
        overflow: hidden;
        color: #e8f1ff;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .dzl-split-handle {
        cursor: col-resize;
        border-radius: 999px;
        position: relative;
        touch-action: none;
      }

      .dzl-split-handle::after {
        content: "";
        position: absolute;
        inset: 12px 2px;
        border-radius: 999px;
        background: rgba(96,165,250,.24);
        transition: background .15s ease;
      }

      .dzl-split-handle:hover::after,
      .dzl-split-handle.dragging::after {
        background: rgba(96,165,250,.75);
      }

      .dzl-ai-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .dzl-ai-tab,
      .dzl-mobile-workspace-tab {
        appearance: none;
        border: 1px solid #263a58;
        background: #101d31;
        color: #b8c9e3;
        border-radius: 8px;
        padding: 7px 10px;
        white-space: nowrap;
        font: inherit;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
      }

      .dzl-ai-tab.active,
      .dzl-mobile-workspace-tab.active {
        color: #eff6ff;
        border-color: #60a5fa;
        background: #17345a;
      }

      .dzl-ai-panel {
        display: none;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        flex-direction: column;
      }

      .dzl-ai-panel.active {
        display: flex;
      }

      .dzl-agent-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
      }

      .dzl-agent-name {
        color: #f1f5f9;
        font-size: 13px;
        font-weight: 900;
      }

      .dzl-agent-meta,
      .dzl-agent-muted {
        margin-top: 4px;
        color: #8194aa;
        font-size: 11px;
      }

      .dzl-agent-mode {
        border: 1px solid rgba(52,211,153,.35);
        background: rgba(16,185,129,.12);
        color: #6ee7b7;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 900;
      }

      .dzl-agent-context {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
        color: #a9bddb;
        font-size: 10px;
      }

      .dzl-agent-context span {
        border: 1px solid #233a59;
        background: #0b1829;
        border-radius: 999px;
        padding: 4px 7px;
      }

      .dzl-agent-card {
        border: 1px solid #1d324d;
        background: #07111f;
        border-radius: 8px;
        padding: 11px;
        margin-bottom: 8px;
        color: #c9d7eb;
        font-size: 11px;
        line-height: 1.55;
      }

      .dzl-agent-card strong {
        color: #eff6ff;
        display: block;
        margin-bottom: 5px;
      }

      .dzl-agent-card-grow {
        flex: 1;
        min-height: 100px;
      }

      .dzl-browser-placeholder {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 8px;
        border: 1px dashed #263a58;
        border-radius: 10px;
        color: #8194aa;
        padding: 24px;
      }

      .dzl-browser-placeholder strong {
        color: #e8f1ff;
        font-size: 14px;
      }

      .dzl-mobile-workspace-tabs {
        display: none;
        padding: 7px 8px;
        gap: 6px;
        background: #08111d;
        border-bottom: 1px solid rgba(148,163,184,.12);
      }

      .dzl-split-presets {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      @media (max-width: 900px) {

        .dzl-terminal-overlay {
          padding: 0;
          align-items: stretch;
          justify-content: stretch;
        }

        .dzl-terminal-window,
        .dzl-terminal-window.expanded {
          width: 100vw;
          height: 100dvh;
          max-width: none;
          border-radius: 0;
        }

        .dzl-terminal-header {
          min-height: 48px;
        }

        .dzl-private-pill {
          display: none;
        }

        .dzl-mobile-workspace-tabs {
          display: flex;
        }

        .dzl-terminal-split {
          display: block;
          padding: 0;
          position: relative;
        }

        .dzl-terminal-frame-wrap,
        .dzl-ai-workspace {
          width: 100%;
          height: 100%;
          min-height: 0;
          border-radius: 0;
        }

        .dzl-ai-workspace {
          display: none;
          border: 0;
        }

        .dzl-terminal-split.mobile-ai .dzl-terminal-frame-wrap {
          display: none;
        }

        .dzl-terminal-split.mobile-ai .dzl-ai-workspace {
          display: flex;
        }

        .dzl-split-handle {
          display: none;
        }

        .dzl-terminal-hint {
          display: none;
        }
      }

      @media (max-width: 560px) {

        .dzl-terminal-header {
          padding: 7px;
        }

        .dzl-terminal-toolbar {
          overflow-x: auto;
          align-items: flex-start;
        }

        .dzl-terminal-session-actions,
        .dzl-terminal-shortcuts {
          flex-wrap: nowrap;
        }

        .dzl-ai-workspace {
          padding: 9px;
        }

        .dzl-ai-tabs {
          margin-bottom: 7px;
        }
      }

      /* DZL_AGENT_UI_V81 */

      .dzl-agent-live-header {
        gap: 12px;
      }

      .dzl-agent-header-status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 6px;
      }

      .dzl-agent-state {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid #334155;
        border-radius: 999px;
        background: #0b1524;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .05em;
      }

      .dzl-agent-state[data-state="READY"] {
        border-color: #176b4e;
        background: #08251c;
        color: #86efac;
      }

      .dzl-agent-state[data-state="BUSY"] {
        border-color: #245d95;
        background: #081d32;
        color: #93c5fd;
      }

      .dzl-agent-state[data-state="WAITING_APPROVAL"] {
        border-color: #9a6b16;
        background: #2b1c04;
        color: #fde68a;
      }

      .dzl-agent-state[data-state="ERROR"] {
        border-color: #8b2635;
        background: #2b0b11;
        color: #fca5a5;
      }

      .dzl-agent-task-card {
        flex: 0 0 auto;
      }

      .dzl-agent-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .dzl-agent-input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        min-height: 88px;
        max-height: 220px;
        resize: vertical;
        padding: 9px 10px;
        border: 1px solid #263a58;
        border-radius: 7px;
        outline: none;
        background: #07111f;
        color: #e8f1ff;
        font: inherit;
        font-size: 12px;
        line-height: 1.45;
      }

      .dzl-agent-input:focus {
        border-color: #3b82f6;
      }

      .dzl-agent-actions {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .dzl-agent-button {
        min-height: 31px;
        padding: 5px 10px;
        border: 1px solid #263a58;
        border-radius: 6px;
        background: #0b1728;
        color: #dbeafe;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
      }

      .dzl-agent-button:hover:not(:disabled) {
        background: #13233a;
      }

      .dzl-agent-button:disabled {
        opacity: .4;
        cursor: not-allowed;
      }

      .dzl-agent-button-primary {
