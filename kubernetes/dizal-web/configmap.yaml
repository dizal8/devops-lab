    <script>
    (function () {

      const TERMINAL_URL =
        "https://dzl.tail52c2d4.ts.net:8443/";

      function overlay() {
        return document.getElementById(
          "dzl-terminal-overlay"
        );
      }

      function terminalWindow() {
        return document.getElementById(
          "dzl-terminal-window"
        );
      }

      function frame() {
        return document.getElementById(
          "dzl-terminal-frame"
        );
      }

      function toast(message) {

        const element =
          document.getElementById(
            "dzl-terminal-toast"
          );

        if (!element) {
          return;
        }

        element.textContent = message;

        element.classList.add(
          "visible"
        );

        clearTimeout(
          window.dzlToastTimer
        );

        window.dzlToastTimer =
          setTimeout(
            function () {
              element.classList.remove(
                "visible"
              );
            },
            1800
          );
      }


      window.dzlOpenTerminal =
        function () {

          const terminalOverlay =
            overlay();

          const terminalFrame =
            frame();

          if (!terminalOverlay ||
              !terminalFrame) {
            return;
          }

          if (!terminalFrame.src) {
            terminalFrame.src =
              terminalFrame.dataset.src
              || TERMINAL_URL;
          }

          terminalOverlay.classList.add(
            "open"
          );

          terminalOverlay.setAttribute(
            "aria-hidden",
            "false"
          );

          document.body.classList.add(
            "dzl-terminal-open"
          );
        };


      window.dzlCloseTerminal =
        function () {

          const terminalOverlay =
            overlay();

          if (!terminalOverlay) {
            return;
          }

          terminalOverlay.classList.remove(
            "open"
          );

          terminalOverlay.setAttribute(
            "aria-hidden",
            "true"
          );

          document.body.classList.remove(
            "dzl-terminal-open"
          );
        };


      window.dzlReloadTerminal =
        function () {

          const terminalFrame =
            frame();

          if (!terminalFrame) {
            return;
          }

          terminalFrame.src =
            TERMINAL_URL
            + "?reconnect="
            + Date.now();

          toast(
            "Terminal reconnected"
          );
        };


      window.dzlToggleTerminalExpand =
        function () {

          const element =
            terminalWindow();

          if (!element) {
            return;
          }

          element.classList.toggle(
            "expanded"
          );
        };


      window.dzlTerminalFullscreen =
        async function () {

          const element =
            terminalWindow();

          if (!element) {
            return;
          }

          try {

            if (!document.fullscreenElement) {
              await element.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }

          } catch (error) {

            console.error(error);

            toast(
              "Fullscreen unavailable"
            );
          }
        };


      window.dzlOpenTerminalSeparate =
        function () {

          window.open(
            TERMINAL_URL,
            "_blank",
            "noopener,noreferrer"
          );
        };


      window.dzlCopyCommand =
        async function (command) {

          try {

            await navigator.clipboard.writeText(
              command
            );

            toast(
              "Command copied"
            );

          } catch (error) {

            console.error(error);

            toast(
              command
            );
          }
        };


      window.dzlOpenAIOps =
        async function () {

          const command =
            "bash scripts/ai-readonly-audit.sh";

          try {

            await navigator.clipboard.writeText(
              command
            );

          } catch (_) {
          }

          window.dzlOpenTerminal();

          toast(
            "AI Audit command copied"
          );
        };


      document.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Escape") {
            window.dzlCloseTerminal();
          }

        }
      );


      document.addEventListener(
        "click",
        function (event) {

          const terminalOverlay =
            overlay();

          if (event.target ===
              terminalOverlay) {

            window.dzlCloseTerminal();
          }

        }
      );

    })();

          // DZL_SESSION_TOOLS_FINAL_JS

          const DZL_SESSION_API =
            "https://dzl.tail52c2d4.ts.net:8444";

          async function dzlSessionRequest(path, options) {
            const response = await fetch(
              DZL_SESSION_API + path,
              Object.assign(
                { cache: "no-store" },
                options || {}
              )
            );

            if (!response.ok) {
              throw new Error(
                "Session API HTTP " + response.status
              );
            }

            return response.text();
          }

          window.dzlClearTerminal = async function () {
            try {
              await dzlSessionRequest(
                "/clear",
                { method: "POST" }
              );

              toast("Terminal cleared");
            } catch (error) {
              console.error(error);
              toast("Clear unavailable");
            }
          };

          window.dzlPasteTerminal = async function () {
            try {
              const value =
                await navigator.clipboard.readText();

              if (!value) {
                toast("Clipboard empty");
                return;
              }

              await dzlSessionRequest(
                "/paste",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    text: value
                  })
                }
              );

              toast("Pasted into terminal");

              const terminalFrame = frame();

              if (terminalFrame) {
                terminalFrame.focus();
              }

            } catch (error) {
              console.error(error);
              toast("Clipboard permission denied");
            }
          };

          window.dzlCopyLast = async function (markdown) {
            try {
              const value =
                await dzlSessionRequest(
                  markdown ? "/last-md" : "/last"
                );

              await navigator.clipboard.writeText(value);

              toast(
                markdown
                  ? "Copied as Markdown"
                  : "Copied"
              );

            } catch (error) {
              console.error(error);
              toast("Copy unavailable");
            }
          };


          // DZL_RUN_BUTTON_FINAL_JS

          let dzlRunBusy = false;

          window.dzlRunTerminal =
            async function () {

              if (dzlRunBusy) {
                return;
              }

              dzlRunBusy = true;

              try {

                const result =
                  await dzlSessionRequest(
                    "/enter",
                    {
                      method: "POST",
                    }
                  );

                if (
                  result !== "executed"
                ) {

                  console.warn(
                    "Unexpected /enter response:",
                    result
                  );
                }

                toast(
                  "Executed"
                );

              } catch (error) {

                console.error(error);

                toast(
                  "Run unavailable"
                );

              } finally {

                setTimeout(
                  function () {
                    dzlRunBusy = false;
                  },
                  450
                );
              }
            };


            const DZL_AI_URL = "https://dzl.tail52c2d4.ts.net:8446";
            const DZL_SESSION_URL = "https://dzl.tail52c2d4.ts.net:8444";
            const DZL_AGENT_URL = "https://dzl.tail52c2d4.ts.net:8447";

            function dzlAiAppend(role, text) {
              const box = document.getElementById("dzl-ai-chat");
              if (!box) return;
              const row = document.createElement("div");
              row.style.marginBottom = "8px";
              row.style.color = role === "YOU" ? "#93c5fd" : "#e8f1ff";
              row.textContent = role + ": " + text;
              box.appendChild(row);
              box.scrollTop = box.scrollHeight;
            }

            window.dzlAiHealth = async function() {
              const status = document.getElementById("dzl-ai-status");
              const gpu = document.getElementById("dzl-ai-gpu");
              try {
                const [h, r] = await Promise.all([
                  fetch(DZL_AI_URL + "/health").then(x => x.json()),
                  fetch(DZL_AI_URL + "/runtime").then(x => x.json())
                ]);
                status.textContent =
                  h.status === "ok"
                    ? "Online · " + h.model + " · no API cost"
                    : "Offline";

                const loaded = (r.models || []).find(
                  x => x.name === h.model || x.model === h.model
                );

                gpu.textContent = loaded && loaded.size_vram
                  ? "GPU · " + Math.round(loaded.size_vram / 1024 / 1024) + " MB"
                  : "GPU · idle";
              } catch (err) {
                status.textContent = "Offline";
                gpu.textContent = "GPU ?";
              }
            };

            window.dzlAiSend = async function(message) {
              const input = document.getElementById("dzl-ai-input");
              const q = (message || input.value || "").trim();
              if (!q) return;

              if (!message) input.value = "";
              dzlAiAppend("YOU", q);
              dzlAiAppend("AI", "Thinking...");

              const box = document.getElementById("dzl-ai-chat");
              const pending = box.lastElementChild;

              try {
                const r = await fetch(DZL_AI_URL + "/chat", {
                  method: "POST",
                  headers: {"Content-Type": "application/json"},
                  body: JSON.stringify({message: q})
                });
                const d = await r.json();
                pending.textContent = "AI: " + (d.answer || d.error || "No response");
              } catch (err) {
                pending.textContent = "AI: Request failed";
              }

              box.scrollTop = box.scrollHeight;
              dzlAiHealth();
            };

            window.dzlAskLastOutput = async function() {
              try {
                const r = await fetch(DZL_SESSION_URL + "/last");
                const type = r.headers.get("content-type") || "";
                let output;

                if (type.includes("application/json")) {
                  const d = await r.json();
                  output = d.output || d.text || d.last || JSON.stringify(d);
                } else {
                  output = await r.text();
                }

                output = (output || "").trim();

                if (!output) {
                  dzlAiAppend("AI", "No terminal output available.");
                  return;
                }

              dzlAiSend(
                "Analyze this terminal output. Explain the problem, risks, and next safe command.\\n\\n" +
                output.slice(-12000)
              );
              } catch (err) {
                dzlAiAppend("AI", "Could not read terminal output.");
              }
            };

            window.dzlAiKeydown = function(event) {
              if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                dzlAiSend();
              }
            };

            window.dzlAiNewChat = function() {
              const box = document.getElementById("dzl-ai-chat");
              if (box) box.innerHTML =
                '<div style="color:#8194aa">New local AI session.</div>';
            };

            dzlAiHealth();

    </script>

    <script>
    /* DZL_CONSOLE_V8_CONTROLLER */
    (function () {

      const split =
        document.getElementById("dzl-terminal-split");

      const handle =
        document.getElementById("dzl-split-handle");

      window.dzlSetSplit = function(percent) {

        if (!split) return;

        const value =
          Math.max(28, Math.min(72, Number(percent) || 55));

        split.style.setProperty(
          "--dzl-terminal-pane",
          value + "%"
        );

        try {
          localStorage.setItem(
            "dzl-console-split",
            String(value)
          );
        } catch (_) {}
      };


      /* DZL_AGENT_UI_V81_CONTROLLER */

      let dzlAgentStatus = null;
      let dzlAgentPollBusy = false;

      function dzlAgentEl(id) {
        return document.getElementById(id);
      }

      function dzlAgentStatusIcon(status) {
        if (status === "success") return "✓";
        if (status === "running") return "●";
        if (status === "queued") return "◐";
        if (status === "stopped") return "×";
        if (status === "failed") return "!";
        return "○";
      }

      function dzlAgentFormatTime(value) {
        if (!value) return "";

        const match =
          String(value).match(
            /T(\d{2}):(\d{2}):(\d{2})/
          );

        if (!match) return "";

        return (
          match[1] +
          ":" +
          match[2] +
          ":" +
          match[3]
        );
      }

      async function dzlAgentRequest(
        path,
        options
      ) {
        const response = await fetch(
          DZL_AGENT_URL + path,
          Object.assign(
            {
              cache: "no-store"
            },
            options || {}
          )
        );

        let data = null;

        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            "HTTP " + response.status
          );
        }

        return data;
      }

      function dzlAgentRenderStatus(data) {
        dzlAgentStatus = data || {};

        const state =
          data && data.state
            ? data.state
            : "OFFLINE";

        const badge =
          dzlAgentEl("dzl-agent-state");

        if (badge) {
          badge.textContent = state;
          badge.dataset.state = state;
        }

        const meta =
          dzlAgentEl("dzl-agent-meta");

        if (meta) {
          meta.textContent =
            (data.model || "unknown model") +
            " · " +
            (data.branch || "unknown branch");
        }

        const task = data.task || null;
        const pending =
          data.pending_approval || null;

        const run =
          dzlAgentEl("dzl-agent-run");

        const stop =
          dzlAgentEl("dzl-agent-stop");

        if (run) {
          run.disabled =
            state === "BUSY" ||
            state === "WAITING_APPROVAL";
        }

        if (stop) {
          stop.disabled = !(
            state === "BUSY" ||
            state === "WAITING_APPROVAL"
          );
        }

        const taskState =
          dzlAgentEl(
            "dzl-agent-task-state"
          );

        if (taskState) {
          taskState.textContent =
            task && task.status
              ? task.status
              : state === "READY"
                ? "Ready"
                : state;
        }

        const approval =
          dzlAgentEl(
            "dzl-agent-approval"
          );

        if (approval) {
          approval.hidden = !pending;
        }

        if (pending) {
          const tool =
            dzlAgentEl(
              "dzl-agent-approval-tool"
            );

          const preview =
            dzlAgentEl(
              "dzl-agent-approval-preview"
            );

          if (tool) {
            tool.textContent =
              pending.tool +
              (
                pending.arguments &&
                pending.arguments.path
                  ? " · " +
                    pending.arguments.path
                  : ""
              );
          }

          if (preview) {
            preview.textContent =
              pending.preview ||
              JSON.stringify(
                pending.arguments || {},
                null,
                2
              );
          }
        }

        const result =
          dzlAgentEl("dzl-agent-result");

        const resultState =
          dzlAgentEl(
            "dzl-agent-result-state"
          );

        if (task && task.result) {
          if (result) {
            result.textContent =
              String(task.result);
          }

          if (resultState) {
            resultState.textContent =
              task.status || "complete";
          }
        } else if (
          task &&
          task.status === "running"
        ) {
          if (result) {
            result.textContent =
              "Task in progress...";
          }

          if (resultState) {
            resultState.textContent =
              "running";
          }
        }
      }

      function dzlAgentRenderEvents(
        events,
        status
      ) {
        const box =
          dzlAgentEl("dzl-agent-events");

        if (!box) return;

        let rows =
          Array.isArray(events)
            ? events.slice()
            : [];

        const task =
          status && status.task
            ? status.task
            : null;

        /*
         * Events are persisted between restarts.
         * For a current/last task, show only
         * events from that task's start time.
         */
        if (
          task &&
          task.started_at
        ) {
          rows = rows.filter(
            function(event) {
              return (
                !event.timestamp ||
                event.timestamp >=
                  task.started_at
              );
            }
          );
        }

        rows = rows.slice(-50);

        box.textContent = "";

        if (!rows.length) {
          const empty =
            document.createElement("div");

          empty.className =
            "dzl-agent-empty";

          empty.textContent =
            "No Agent activity yet.";

          box.appendChild(empty);
          return;
        }

        rows.forEach(function(event) {
          const row =
            document.createElement("div");

          row.className =
            "dzl-agent-event";

          row.dataset.status =
            event.status || "";

          const icon =
            document.createElement("div");

          icon.className =
            "dzl-agent-event-icon";

          icon.textContent =
            dzlAgentStatusIcon(
              event.status
            );

          const main =
            document.createElement("div");

          main.className =
            "dzl-agent-event-main";

          const label =
            document.createElement("div");

          label.className =
            "dzl-agent-event-label";

          label.textContent =
            event.label ||
            event.type ||
            "Event";

          main.appendChild(label);

          const details = [];

          if (event.type) {
            details.push(event.type);
          }

          if (event.target) {
            details.push(event.target);
          }

          if (event.summary) {
            details.push(
              String(event.summary)
                .slice(0, 700)
            );
          }

          if (details.length) {
            const meta =
              document.createElement(
                "div"
              );

            meta.className =
              "dzl-agent-event-meta";

            meta.textContent =
              details.join(" · ");

            main.appendChild(meta);
          }

          const when =
            document.createElement("div");

          when.className =
            "dzl-agent-event-time";

          when.textContent =
            dzlAgentFormatTime(
              event.timestamp
            );

          row.appendChild(icon);
          row.appendChild(main);
          row.appendChild(when);

          box.appendChild(row);
        });

        box.scrollTop =
          box.scrollHeight;

        const activityStatus =
          dzlAgentEl(
            "dzl-agent-activity-status"
          );

        if (activityStatus) {
          activityStatus.textContent =
            rows.length +
            " event" +
            (rows.length === 1 ? "" : "s");
        }
      }

      window.dzlAgentRefresh =
        async function() {
          if (dzlAgentPollBusy) {
            return;
          }

          dzlAgentPollBusy = true;

          try {
            const results =
              await Promise.all([
                dzlAgentRequest(
                  "/agent/status"
                ),
                dzlAgentRequest(
                  "/agent/events"
                )
              ]);

            dzlAgentRenderStatus(
              results[0]
            );

            dzlAgentRenderEvents(
              results[1].events || [],
              results[0]
            );

          } catch (err) {
            const badge =
              dzlAgentEl(
                "dzl-agent-state"
              );

            if (badge) {
              badge.textContent =
                "OFFLINE";

              badge.dataset.state =
                "OFFLINE";
            }

            const meta =
              dzlAgentEl(
                "dzl-agent-meta"
              );

            if (meta) {
              meta.textContent =
                "Agent API unavailable";
            }

          } finally {
            dzlAgentPollBusy = false;
          }
        };

      window.dzlAgentRun =
        async function() {
          const input =
            dzlAgentEl(
              "dzl-agent-input"
            );

          const instruction =
            (
              input &&
              input.value
                ? input.value
                : ""
            ).trim();

          if (!instruction) {
            return;
          }

          const run =
            dzlAgentEl(
              "dzl-agent-run"
            );

          if (run) {
            run.disabled = true;
          }

          try {
            await dzlAgentRequest(
              "/agent/tasks",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  instruction:
                    instruction
                })
              }
            );

            await dzlAgentRefresh();

          } catch (err) {
            const result =
              dzlAgentEl(
                "dzl-agent-result"
              );

            if (result) {
              result.textContent =
                "Task start failed: " +
                err.message;
            }

            if (run) {
              run.disabled = false;
            }
          }
        };

      window.dzlAgentApprove =
        async function() {
          const pending =
            dzlAgentStatus &&
            dzlAgentStatus
              .pending_approval;

          if (!pending || !pending.id) {
            return;
          }

          try {
            await dzlAgentRequest(
              "/agent/approve",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  approval_id:
                    pending.id
                })
              }
            );

            await dzlAgentRefresh();

          } catch (err) {
            console.error(
              "DZL Agent approve:",
              err
            );
          }
        };

      window.dzlAgentReject =
        async function() {
          const pending =
            dzlAgentStatus &&
            dzlAgentStatus
              .pending_approval;

          if (!pending || !pending.id) {
            return;
          }

          try {
            await dzlAgentRequest(
              "/agent/reject",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  approval_id:
                    pending.id
                })
              }
            );

            await dzlAgentRefresh();

          } catch (err) {
            console.error(
              "DZL Agent reject:",
              err
            );
          }
        };

      window.dzlAgentStop =
        async function() {
          try {
            await dzlAgentRequest(
              "/agent/stop",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: "{}"
              }
            );

            await dzlAgentRefresh();

          } catch (err) {
            console.error(
              "DZL Agent stop:",
              err
            );
          }
        };

      /*
       * Polling is deliberately modest.
       * Agent tool execution does not
       * require sub-second UI updates.
       */
      setInterval(
        function() {
          const panel =
            document.querySelector(
              '[data-dzl-ai-panel="agent"]'
            );

          if (
            panel &&
            panel.classList.contains(
              "active"
            )
          ) {
            dzlAgentRefresh();
          }
        },
        1250
      );

      setTimeout(
        function() {
          dzlAgentRefresh();
        },
        350
      );


      window.dzlSelectAiTab = function(name) {

        document
          .querySelectorAll("[data-dzl-ai-tab]")
          .forEach(function(button) {
            button.classList.toggle(
              "active",
              button.dataset.dzlAiTab === name
            );
          });

        document
          .querySelectorAll("[data-dzl-ai-panel]")
          .forEach(function(panel) {
            panel.classList.toggle(
              "active",
              panel.dataset.dzlAiPanel === name
            );
          });

        try {
          localStorage.setItem(
            "dzl-ai-tab",
            name
          );
        } catch (_) {}
      };

      window.dzlSetMobileWorkspace =
        function(name) {

          if (!split) return;

          split.classList.toggle(
            "mobile-ai",
            name === "ai"
          );

          document
            .querySelectorAll(
              "[data-dzl-mobile-workspace]"
            )
            .forEach(function(button) {
              button.classList.toggle(
                "active",
                button.dataset.dzlMobileWorkspace === name
              );
            });
        };

      try {

        const savedSplit =
          Number(
            localStorage.getItem(
              "dzl-console-split"
            )
          );

        if (savedSplit) {
          window.dzlSetSplit(savedSplit);
        }

        const savedTab =
          localStorage.getItem("dzl-ai-tab");

        if (savedTab) {
          window.dzlSelectAiTab(savedTab);
        } else {
          window.dzlSelectAiTab("agent");
        }

      } catch (_) {

        window.dzlSelectAiTab("agent");

      }

      if (handle && split) {

        let dragging = false;

        function move(event) {

          if (!dragging) return;

          const rect =
            split.getBoundingClientRect();

          const x =
            event.clientX - rect.left;

          const percent =
            x / rect.width * 100;

          window.dzlSetSplit(percent);
        }

        handle.addEventListener(
          "pointerdown",
          function(event) {

            if (window.innerWidth <= 900) {
              return;
            }

            dragging = true;

            handle.classList.add(
              "dragging"
            );

            handle.setPointerCapture(
              event.pointerId
            );
          }
        );

        handle.addEventListener(
          "pointermove",
          move
        );

        handle.addEventListener(
          "pointerup",
          function(event) {

            dragging = false;

            handle.classList.remove(
              "dragging"
            );

            try {
              handle.releasePointerCapture(
                event.pointerId
              );
            } catch (_) {}
          }
        );
      }

    })();
    </script>

    </body>
    </html>
