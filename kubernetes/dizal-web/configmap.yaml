            link: "https://github.com/dizal8/devops-lab/actions"
          },
          "Argo CD": {
            link: "http://argocd.dzl.ro",
            health: "http://argocd.dzl.ro"
          },
          "Grafana": {
            link: "https://grafana.lab01.dzl.ro",
            health: "https://grafana.lab01.dzl.ro/api/health"
          },
          "Prometheus": {
