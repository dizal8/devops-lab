    <div
      id="dzl-terminal-toast"
      class="dzl-terminal-toast"
    ></div>

    <script>
    (function () {

      const TERMINAL_URL =
        "https://dzl.tail52c2d4.ts.net:8443/";

      function overlay() {
        return document.getElementById(
          "dzl-terminal-overlay"
        );
      }

      function terminalWindow() {
        return document.getElementById(
          "dzl-terminal-window"
        );
      }

      function frame() {
        return document.getElementById(
          "dzl-terminal-frame"
        );
      }

      function toast(message) {

        const element =
          document.getElementById(
            "dzl-terminal-toast"
          );

        if (!element) {
          return;
        }

        element.textContent = message;

        element.classList.add(
          "visible"
        );

        clearTimeout(
          window.dzlToastTimer
        );

        window.dzlToastTimer =
          setTimeout(
            function () {
              element.classList.remove(
                "visible"
              );
            },
            1800
          );
      }


      window.dzlOpenTerminal =
        function () {

          const terminalOverlay =
            overlay();

          const terminalFrame =
            frame();

          if (!terminalOverlay ||
              !terminalFrame) {
            return;
          }

          if (!terminalFrame.src) {
            terminalFrame.src =
              terminalFrame.dataset.src
              || TERMINAL_URL;
          }

          terminalOverlay.classList.add(
            "open"
          );

          terminalOverlay.setAttribute(
            "aria-hidden",
            "false"
          );

          document.body.classList.add(
            "dzl-terminal-open"
          );
        };


      window.dzlCloseTerminal =
        function () {

          const terminalOverlay =
            overlay();

          if (!terminalOverlay) {
            return;
          }

          terminalOverlay.classList.remove(
            "open"
          );

          terminalOverlay.setAttribute(
            "aria-hidden",
            "true"
          );

          document.body.classList.remove(
            "dzl-terminal-open"
          );
        };


      window.dzlReloadTerminal =
        function () {

          const terminalFrame =
            frame();

          if (!terminalFrame) {
            return;
          }

          terminalFrame.src =
            TERMINAL_URL
            + "?reconnect="
            + Date.now();

          toast(
            "Terminal reconnected"
          );
        };


      window.dzlToggleTerminalExpand =
        function () {

          const element =
            terminalWindow();

          if (!element) {
            return;
          }

          element.classList.toggle(
            "expanded"
          );
        };


      window.dzlTerminalFullscreen =
        async function () {

          const element =
            terminalWindow();

          if (!element) {
            return;
          }

          try {

            if (!document.fullscreenElement) {
              await element.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }

          } catch (error) {

            console.error(error);

            toast(
              "Fullscreen unavailable"
            );
          }
        };


      window.dzlOpenTerminalSeparate =
        function () {

          window.open(
            TERMINAL_URL,
            "_blank",
            "noopener,noreferrer"
          );
        };


      window.dzlCopyCommand =
        async function (command) {

          try {

            await navigator.clipboard.writeText(
              command
            );

            toast(
              "Command copied"
            );

          } catch (error) {

            console.error(error);

            toast(
              command
            );
          }
        };


      window.dzlOpenAIOps =
        async function () {

          const command =
            "bash scripts/ai-readonly-audit.sh";

          try {

            await navigator.clipboard.writeText(
              command
            );

          } catch (_) {
          }

          window.dzlOpenTerminal();

          toast(
            "AI Audit command copied"
          );
        };


      document.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Escape") {
            window.dzlCloseTerminal();
          }

        }
      );


      document.addEventListener(
        "click",
        function (event) {

          const terminalOverlay =
            overlay();

          if (event.target ===
              terminalOverlay) {

            window.dzlCloseTerminal();
          }

        }
      );

    })();

          // DZL_SESSION_TOOLS_FINAL_JS

          const DZL_SESSION_API =
            "https://dzl.tail52c2d4.ts.net:8444";

          async function dzlSessionRequest(path, options) {
            const response = await fetch(
              DZL_SESSION_API + path,
              Object.assign(
                { cache: "no-store" },
                options || {}
              )
            );

            if (!response.ok) {
              throw new Error(
                "Session API HTTP " + response.status
              );
            }

            return response.text();
          }

          window.dzlClearTerminal = async function () {
            try {
              await dzlSessionRequest(
                "/clear",
                { method: "POST" }
              );

              toast("Terminal cleared");
            } catch (error) {
              console.error(error);
              toast("Clear unavailable");
            }
          };

          window.dzlPasteTerminal = async function () {
            try {
              const value =
                await navigator.clipboard.readText();

              if (!value) {
                toast("Clipboard empty");
                return;
              }

              await dzlSessionRequest(
                "/paste",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    text: value
                  })
                }
              );

              toast("Pasted into terminal");

              const terminalFrame = frame();

              if (terminalFrame) {
                terminalFrame.focus();
              }

            } catch (error) {
              console.error(error);
              toast("Clipboard permission denied");
            }
          };

          window.dzlCopyLast = async function (markdown) {
            try {
              const value =
                await dzlSessionRequest(
                  markdown ? "/last-md" : "/last"
                );

              await navigator.clipboard.writeText(value);

              toast(
                markdown
                  ? "Copied as Markdown"
                  : "Copied"
              );

            } catch (error) {
              console.error(error);
              toast("Copy unavailable");
            }
          };


          // DZL_RUN_BUTTON_FINAL_JS

          let dzlRunBusy = false;

          window.dzlRunTerminal =
            async function () {

              if (dzlRunBusy) {
                return;
              }

              dzlRunBusy = true;

              try {

                const result =
                  await dzlSessionRequest(
                    "/enter",
                    {
                      method: "POST",
                    }
                  );

                if (
                  result !== "executed"
                ) {

                  console.warn(
                    "Unexpected /enter response:",
                    result
                  );
                }

                toast(
                  "Executed"
                );

              } catch (error) {

                console.error(error);

                toast(
                  "Run unavailable"
                );

              } finally {

                setTimeout(
                  function () {
                    dzlRunBusy = false;
                  },
                  450
                );
              }
            };

    
        window.dzlAiHealth=async function(){
      const e=document.getElementById("dzl-ai-status");
      try{
        const r=await fetch("https://dzl.tail52c2d4.ts.net:8446/health");
        const d=await r.json();
        e.textContent=d.key?"Online":"Online · API key missing";
      }catch(x){e.textContent="Offline";}
    };

    </script>
